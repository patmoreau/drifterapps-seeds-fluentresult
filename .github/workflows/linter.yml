name: linter

on:
  push:
    branches: [main]
    paths-ignore:
      - '.devcontainer/**'

  pull_request:
    branches: [main]
    paths-ignore:
      - '.devcontainer/**'

concurrency:
  group: linter-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  check_changes:
    uses: patmoreau/workflow-config/.github/workflows/check-changes-action.yml@main
    with:
      file_patterns: ${{ vars.LINTER_CODE_FILE_PATTERNS }}

  csharp:
    runs-on: ubuntu-latest
    needs: check_changes
    if: ${{ needs.check_changes.outputs.code_was_changed == 'true' }}

    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: ./global.json

      - name: Lint C# files with dotnet format
        id: lint
        continue-on-error: true
        run: dotnet format --verify-no-changes --severity error --verbosity diagnostic --report ./linter-report

      - name: Save report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dotnet-format-report
          path: ./linter-report/*

      - name: Check for errors
        if: ${{ steps.lint.outcome != 'success' }}
        run: |
          echo "::error::dotnet format found issues in the code. Please fix them."
          exit 1

  agent-files:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Verify generated assistant command files are up to date
        run: ./scripts/sync-agent-files.sh --check

  create_check:
    needs: [check_changes, csharp, agent-files]
    permissions:
      checks: write
    uses: patmoreau/workflow-config/.github/workflows/create-check.yml@main
    if: always() && needs.check_changes.result == 'success'
    with:
      # agent-files runs on every commit, including doc-only ones where csharp is
      # skipped, so its failure must be reported even when no code changed.
      code_was_changed: ${{ needs.check_changes.outputs.code_was_changed }}
      enforce_when_unchanged: true
      check_name: 'linter-completed'
      check_result: >-
        ${{ (needs.csharp.result == 'success' || needs.csharp.result == 'skipped')
        && needs['agent-files'].result == 'success' && 'success' || 'failure' }}
